--brand);color:white;border-radius:11px;padding:11px 17px;font-weight:800;min-height:44px}.btn.secondary{background:var(--paper);border-color:var(--line);color:var(--ink)}.btn.ghost{background:var(--brand2);color:var(--brand);border-color:var(--line)}.btn.danger{background:var(--paper);border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label,.label{font-size:.9rem;font-weight:750;color:var(--muted)}input[type=text],input[type=email],input[type=number],select,textarea{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:11px;max-width:100%;width:100%}textarea{line-height:1.7;min-height:95px;resize:vertical}.hint{font-size:.88rem;color:var(--muted);line-height:1.7}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--brand2);border-radius:30px;padding:6px 11px;font-size:.8rem;font-weight:800;color:var(--brand)}.chip{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:7px 11px;margin:3px 6px 3px 0}.warning{background:var(--brand2);border-left:4px solid var(--brand);padding:12px 15px;line-height:1.7;border-radius:7px}.dangertext{color:var(--bad)}.oktext{color:var(--good)}.muted{color:var(--muted)}.hide{display:none!important}.theme-grid{display:flex;gap:7px;flex-wrap:wrap}.theme-btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 12px;border-radius:9px}.theme-btn.selected{outline:3px solid var(--brand);outline-offset:1px}.sec-row{display:grid;grid-template-columns:1fr auto 110px;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--line)}.sec-row:last-child{border:0}.sec-row input{min-width:74px}.progress-bg{height:9px;background:var(--line);border-radius font-size:1rem}.report-answer{line-height:1.7}.report-answer p{margin:4px 0}.report-footer{margin-top:25px;padding-top:18px;border-top:3px solid var(--ink)}.report-footer h3{margin-top:0}#printArea{display:none}.footer{padding-top:25px;text-align:center;font-size:.82rem;color:var(--muted)}.exam-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;z-index:99;box-shadow:var(--shadow);max-width:450px}.review-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.review-filter button{font-size:.85rem}.numgrid{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0}.numgrid button{height:35px;min-width:35px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:var(--paper)}.numgrid button.selected{background:var(--brand);color:white;border-color:var(--brand)}.numgrid button.done{border-color:var(--good)}.printhead{display:none}

/* 解析待確認與語音報讀工具 */
.issue-panel{border:2px solid var(--line);border-radius:14px;padding:16px;margin:13px 0;background:var(--paper)}
.issue-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}
.issue-row:last-child{border:0}.issue-reasons{font-size:.88rem;color:var(--muted);line-height:1.7}.review-item:target{outline:3px solid var(--brand);outline-offset:3px}
.math-inline{display:inline-block!important;vertical-align:middle!important;max-height:4.4em!important;max-width:min(100%,350px)!important;width:auto!important;margin:0 .12em!important;object-fit:contain}.math-diagram{display:block!important;max-height:480px!important;max-width:min(100%,700px)!important;margin:12px auto!important;object-fit:contain}.math-missing{display:inline-block;border:2px dotted #b35704;background:#fff1cf;color:#442608;border-radius:6px;padding:2px 7px;font-weight:800;vertical-align:middle}.math-warning{border-left:5px solid #c86b00;padding:12px;margin:12px 0;background:var(--brand2);line-height:1.7}html.contrast .math-missing{background:#000;color:#fff;border-color:#fff}html.contrast .math-warning{background:#000;border-color:#fff}html.contrast .math-inline,html.contrast .math-diagram{background:#fff;border-radius:3px;padding:2px}/* 可存成 HTML 數學分數的正式上下排版；不是只有斜線字串 */
.math-fraction{display:inline-block;vertical-align:middle;white-space:nowrap;font-size:1.08em;margin:0 .1em}
.math-fraction math{font-family:"Cambria Math","STIX Two Math",serif; font-size:1.15em;vertical-align:middle}
.math-help{background:var(--brand2);padding:11px 13px;border-radius:10px;margin:8px 0 16px;font-size:.88rem;line-height:1.75}
.math-help code{font-family:monospace;font-size:1.04em;user-select:all}
.math-preview{border:1px dashed var(--line);padding:10px;margin:7px 0;border-radius:9px;min-height:30px}
.math-rich p{margin:5px 0;line-height:2}.math-preview-grid{display:flex;gap:10px;flex-wrap:wrap}.math-preview-grid img{max-width:200px;max-height:120px;object-fit:contain;background:#fff;border:1px solid var(--line)}

.issue-flag{display:inline-block;font-size:.83rem;color:var(--warn);border:1px solid var(--warn);padding:4px 8px;border-radius:8px;line-height:1.6}

.voice-controls input[type=range]{width:100%;accent-color:var(--brand)}
.voice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.voice-actions .btn{min-width:95px}
.voice-toggle{display:inline-flex;gap:8px;align-items:center;font-weight:750;cursor:pointer}
.voice-custom{border:1px dashed var(--line);border-radius:10px;padding:12px;margin:10px 0}

.math-symbol-guide summary{cursor:pointer;font-size:1.06rem;font-weight:700;padding:.6em}.math-symbol-table{border-collapse:collapse;width:100%;font-size:.92em}.math-symbol-table td,.math-symbol-table th{border:1px solid var(--line);padding:9px;vertical-align:top}.math-symbol-table code{white-space:pre-wrap;overflow-wrap:anywhere}.math-universal math{font-size:1.14em}.math-symbol-table .math-preview{margin:8px 0}.math-symbol-guide{overflow:auto}html.contrast .math-symbol-table td,html.contrast .math-symbol-table th{border-color:white}

/* 10.0：數學行內公式與本文字級同步；大圖保留獨立尺寸。 */
html{--math-inline-height:1.55em;--math-native-size:1em}
html[data-math-layout="compact"]{--math-inline-height:1.20em;--math-native-size:.94em}
html[data-math-layout="normal"]{--math-inline-height:1.55em;--math-native-size:1em}
html[data-math-layout="large"]{--math-inline-height:1.95em;--math-native-size:1.13em}
.content img.math-inline,.choice img.math-inline,.reading img.math-inline,.feedback img.math-inline,.math-preview img.math-inline,
img.math-inline{
 display:inline-block!important; box-sizing:content-box!important;
 height:var(--math-inline-height)!important; width:auto!important;
 max-height:2.2em!important; max-width:min(100%,22em)!important;
 min-width:0!important; object-fit:contain!important;
 vertical-align:-.27em!important; margin:0 .07em!important;
 border:0!important; box-shadow:none!important;
}
.content img.math-diagram,.reading img.math-diagram,img.math-diagram{width:auto!important;height:auto!important;max-width:100%!important;max-height:430px!important;display:block!important;object-fit:contain!important}
.math-fraction,.math-universal{font-size:var(--math-native-size)!important;line-height:1.3!important;vertical-align:-.1em!important;white-space:nowrap}
.math-fraction math,.math-universal math{font-size:1em!important;line-height:1.15!important}
.choice>span:not(.choice-label){min-width:0;overflow-wrap:anywhere;line-height:1.55}
.question-title .math-inline,.choice .math-inline{break-inside:avoid}
.math-layout-menu{position:relative;display:inline-block;vertical-align:middle;margin-left:4px}
.math-layout-menu summary{list-style:none;cursor:pointer;white-space:nowrap;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-size:.88rem;font-weight:700}
.math-layout-menu summary::-webkit-details-marker{display:none}
.math-layout-popover{position:absolute;right:0;top:calc(100% + 6px);width:245px;z-index:999;background:var(--paper);color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 30px #0002;border-radius:12px;padding:13px}
.math-layout-popover label{display:block;font-weight:700;margin-bottom:8px;font-size:.88rem}
.math-layout-popover select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:var(--paper);padding:6px 8px}

@media print{img.math-inline{height:1.32em!important;max-height:1.75em!important}.math-fraction,.math-universal{font-size:1em!important}.math-layout-menu{display:none!important}}


/* 14.0 資料表格：依容器寬度自動排版，不因單一格過寬撐爆手機。 */
.content .docx-data-table,.review-item .docx-data-table,.reading .docx-data-table{
 border-collapse:collapse;width:auto;max-width:100%;table-layout:auto;font-size:0.94em;
 margin:.65em 0 .15em;line-height:1.45;
}
.docx-data-table th,.docx-data-table td{

 vertical-align:middle;white-space:normal;word-break:keep-all;
}
.docx-data-table th{font-weight:700;background:var(--brand2);color:var(--ink)}
.docx-data-table .row-heading{font-weight:600}
.docx-table-caption{caption-side:bottom;font-size:.82em;color:var(--muted);text-align:right;padding-top:3px}
.table-editor{border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;background:var(--brand2)}
.table-editor summary{cursor:pointer;font-weight:700}
.table-editor .table-tsv{font-family:ui-monospace,Consolas,monospace;min-height:120px;white-space:pre;overflow:auto}
html.contrast .docx-data-table th,html.contrast .docx-data-table td{border:2px solid #fff!important;color:#fff!important;background:#000!important}
html.contrast .table-editor{background:#000!important;color:#fff!important;border:2px solid #fff}
@media(max-width:640px){.content .docx-data-table{font-size:.82em}.docx-data-table td,.docx-data-table th{padding:.25em .35em}}

/* APP 19: complete groups stay visible on one page. */
.atomic-exam-unit{display:flex;flex-direction:column;gap:16px}
.atomic-subquestion{border:1px solid var(--line);border-radius:12px;padding:16px;break-inside:avoid}
.atomic-subquestion:first-child{margin-top:3px}
.group-subheading{font-size:1.06rem;margin:0 0 12px;color:var(--brand)}
.matching-answer-field select{max-width:440px;width:100%;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.report-sub{margin-bottom:12px;padding:10px 0;border-bottom:1px dotted #aaa;break-inside:avoid}
.report-sub:last-child{border-bottom:0}
@media (max-width:600px){.atomic-subquestion{padding:10px}}

/* APP 20: mathematically typeset exponents stay aligned with surrounding text */
.algebra-inline{display:inline-block;vertical-align:-.12em;white-space:nowrap;max-width:100%;line-height:1.1!important;margin:0 .03em;}
.algebra-inline math{font-size:1em!important;line-height:1.1!important;vertical-align:middle;}
.content .algebra-inline,.choice .algebra-inline,.reading .algebra-inline,.feedback .algebra-inline{break-inside:avoid;}
@media print{.algebra-inline{font-size:1em!important;break-inside:avoid;}}

/* APP 21：常駐的一鍵清空入口；不隨頁面切換消失 */
.quick-clear{margin-left:auto;white-space:nowrap;align-self:center;box-shadow:0 1px 0 var(--line)}
.quick-clear:not(:disabled):hover{filter:brightness(.95);outline:2px solid var(--bad);outline-offset:2px}
@media(max-width:600px){.quick-clear{margin-left:0;width:100%;justify-content:center}}
html.contrast .quick-clear:not(:disabled){color:#fff!important;border:2px solid #fff!important;background:#000!important}

/* APP 22: PDF error book + mobile native file sharing. */
.pdf-mail-panel{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:17px;margin-top:17px}
.pdf-mail-panel h3{margin:0 0 10px}.pdf-mail-panel .pdf-mail-steps{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}
.pdf-mail-panel .pdf-mail-steps .btn{min-width:148px}
.pdf-mail-status{border-left:3px solid var(--brand);padding:10px 12px;margin:9px 0;background:var(--brand2);line-height:1.6;font-size:.88rem}
.pdf-mail-help{margin:10px 0 0;font-size:.86rem;line-height:1.8;color:var(--muted)}
.pdf-mail-status[role=status]{white-space:pre-wrap}
.pdf-capture,.pdf-capture *{box-sizing:border-box!important}
.pdf-capture{width:720px;max-width:720px;background:#fff!important;color:#111!important;font:16px/1.6 Arial,'Microsoft JhengHei','Noto Sans TC',sans-serif!important;padding:4px}
.pdf-capture h1{font-size:27px;margin:0 0 10px}.pdf-capture h2{font-size:22px}.pdf-capture h3{font-size:19px;margin:8px 0}
.pdf-capture .printhead{padding:0 0 12px;border-bottom:1px solid #bbb}
.pdf-capture .report-item{margin:0 0 10px;border-bottom:1px solid #ccc;padding:10px 0;page-break-inside:avoid;break-inside:avoid}
.pdf-capture .report-sub{margin:9px 0}.pdf-capture .report-sub p{margin:5px 0}
.pdf-capture .content{line-height:1.65;font-size:16px;overflow-wrap:anywhere}
.pdf-capture .content img,.pdf-capture img{max-width:100%!important;max-height:320px!important;height:auto!important;object-fit:contain}
.pdf-capture .reading{background:#f5f5f5!important;color:#111!important;border:1px solid #aaa!important;padding:12px;page-break-inside:avoid}
.pdf-capture table{border-collapse:collapse;width:100%;table-layout:auto}.pdf-capture td,.pdf-capture th{border:1px solid #777;padding:5px;vertical-align:top}
.pdf-capture .report-footer{margin-top:20px;page-break-before:always;break-before:page}
.pdf-capture .report-answer{page-break-inside:avoid;break-inside:avoid;margin:9px 0;padding:5px 0;border-bottom:1px solid #eee}
.pdf-capture .math-inline{vertical-align:middle!important;max-height:2em!important}
html.contrast .pdf-mail-panel{background:#000!important;color:#fff!important;border-color:#fff!important}
html.contrast .pdf-mail-status{color:#fff!important;background:#000!important;border-color:#fff!important}
html.contrast .pdf-capture,html.contrast .pdf-capture *{background-color:#fff!important;color:#111!important;border-color:#aaa!important}
@media(max-width:650px){.pdf-mail-panel .pdf-mail-steps{flex-direction:column;align-items:stretch}.pdf-mail-panel .pdf-mail-steps .btn{width:100%}}

/* APP 23: 觸控計算區可收合，始終獨立於作答欄位及教師題庫資料。 */
.scratch-toggle{white-space:nowrap}
.scratch-panel{position:fixed;right:12px;bottom:12px;width:min(610px,calc(100vw - 24px));max-height:min(76dvh,720px);background:var(--paper);color:var(--ink);border:2px solid var(--brand);border-radius:17px;box-shadow:0 12px 46px #001b4170;z-index:250;display:flex;flex-direction:column;overflow:hidden}
.scratch-panel[hidden],.report-preview[hidden]{display:none!important}
.scratch-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brand2);padding:10px 13px;border-bottom:1px solid var(--line)}
.scratch-head strong{font-size:1.05rem}.scratch-body{padding:11px 12px;overflow:auto;overscroll-behavior:contain}
.scratch-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.scratch-toolbar button{min-width:42px;min-height:42px;padding:8px 10px}
.scratch-toolbar button[aria-pressed=true]{outline:3px solid var(--brand);outline-offset:1px}
.scratch-toolbar label{display:inline-flex;align-items:center;gap:5px;font-size:.82rem}
.scratch-toolbar input[type=range]{width:74px}
#scratchCanvas{display:block;background:#fff;border:1px solid #9fb1cc;border-radius:10px;width:100%;height:310px;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
.scratch-note{font-size:.8rem;color:var(--muted);margin:8px 0 2px;line-height:1.6}
.report-preview{position:fixed;inset:0;z-index:300;background:#0009;padding:12px;display:flex;align-items:center;justify-content:center}
.report-preview-dialog{background:var(--paper);color:var(--ink);width:min(980px,100%);height:min(94dvh,100%);display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.report-preview-head{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.report-preview-help{padding:9px 15px;font-size:.87rem;line-height:1.7;background:var(--brand2)}
.report-preview-body{overflow:auto;overscroll-behavior:contain;flex:1;background:#f2f2f2;padding:12px}
.report-preview-paper{max-width:850px;margin:auto;background:white;color:#111;padding:20px 25px;font:16px/1.6 Arial,'Noto Sans TC',sans-serif;overflow-wrap:anywhere}
.report-preview-paper .content{color:#111}.report-preview-paper img{max-width:100%!important;height:auto!important;max-height:350px}
.report-preview-paper table{border-collapse:collapse}.report-preview-paper td,.report-preview-paper th{border:1px solid #777;padding:5px}

@media(max-width:640px){.scratch-panel{right:4px;bottom:4px;width:calc(100vw - 8px);max-height:76dvh}.scratch-body{padding:8px}.scratch-toolbar{gap:5px}#scratchCanvas{height:265px}.report-preview{padding:4px}.report-preview-body{padding:5px}.report-preview-paper{padding:13px 10px}}
@media print{.scratch-panel,.report-preview{display:none!important}}

/* APP24: read-only, source-grounded walkthroughs for self-study. */
.study-panel{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
.study-panel h4{margin:0 0 6px;font-size:1.02em}.study-panel .study-step{padding:10px 12px;margin:9px 0;border-left:4px solid var(--brand);border-radius:8px;background:var(--brand2);overflow-wrap:anywhere}
.study-panel .study-step img{max-width:min(100%,580px);max-height:380px;object-fit:contain}
.study-panel .study-step p{margin:4px 0 7px}.study-count{font-size:.9em;color:var(--muted);margin:6px 0}
.study-panel .flex{gap:8px}.study-panel button{min-height:42px}.study-selfcheck{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.study-selfcheck button[aria-pressed="true"]{outline:3px solid var(--brand);font-weight:800}
.study-source-note{font-size:.9em;color:var(--muted);margin:6px 0}.study-empty{padding:9px 10px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
.study-panel details summary{cursor:pointer}.study-panel .math-rich{background:transparent!important}
@media print {.study-panel button,.study-selfcheck button{display:none!important}.study-panel{break-inside:auto}.study-step{break-inside:avoid}}


/* APP 25: 正式手寫答案。和原計算草稿分離；純黑高反差仍使用白底手寫紙。 */
.hw-box{margin:12px 0;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}

.hw-tools .btn{padding:8px 11px}.hw-tools input[type=color]{width:40px;height:33px;padding:0;vertical-align:middle}
.hw-tools input[type=range]{width:82px;vertical-align:middle}
.hw-canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;width:100%;aspect-ratio:16 / 7;min-height:205px;max-height:390px;background:#fff;border:2px solid #b6c6db;border-radius:11px;cursor:crosshair}
.hw-preview{margin:12px 0;padding:10px;border:1px solid #b6c6db;border-radius:12px;background:#fff;color:#182438}
.hw-preview img{display:block;width:auto;max-width:100%;max-height:460px;object-fit:contain;margin:6px auto}
.hw-preview figcaption{font-size:.85rem;color:#273852}

@media print{.hw-tools,.hw-top button,.hw-upload-control{display:none!important}.hw-preview{break-inside:avoid}.hw-preview img{max-height:400px}}

d":"single-3","section":"single","number":3,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 萩淳在文獻上讀到一段外國歷史，她將該國政治體制的發展分為兩個時期，根據以下內容所述，下列何者的推論較正確？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"甲時期","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"統治者經常擅自增加稅收以維持自身奢華的生活，對此批評或表達反對的民眾，通常未經公開審判就被拘捕下獄，而維持政府威權的軍隊，則用來控管人民的行為。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"乙時期","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"推翻獨裁的統治者後，人民選出代表制定法律，政府必須依法行政，不能任意侵害人民的基本權利，例如：自由權、財產權等。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)在甲時期，法律是政府與人民共同遵守的最高規範　(Ｂ)在乙時期，公權力只能約束人民，難以規範統治者　(Ｃ)在甲時期，統治者根據自己的好惡來統治控制人民　(Ｄ)在乙時期，法律是統治者用來限制人民自由的工具。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"甲時期的統治方式應為人治,乙時期則為法治。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｃ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：甲時期的統治方式應為人治，乙時期則為法治。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-4","section":"single","number":4,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 燕翎若想確認某地區是屬於人治或法治的體制，則下列哪一內容最能夠幫助判斷？　\n(Ａ)甲機關：國家領導者制定新法規即日起施行　(Ｂ)乙機關：設置研發部門，開放國際廠商投資　(Ｃ)丙機關：港口與機場進出務必加強防疫工作　(Ｄ)丁機關：下年度預算運用依照會議結論辦理。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"人治社會,法律就是統治者的意思。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：人治社會，法律就是統治者的意思。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-5","section":"single","number":5,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 彩瑤引用一份文獻記載如以下所示，請判斷她想揭示的重點最可能為下列何者？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"《大憲章》：除非經過法律審判，或是根據法律，否則任何自由的人，不該被囚禁、奪去財產、或被殺害。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)國家的組成　(Ｂ)法治的精神　(Ｃ)教育的普及　(Ｄ)利益的分配。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"應由法律來保障個人不受侵害。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：應由法律來保障個人不受侵害。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-6","section":"single","number":6,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"( ionCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：我國為法治社會，政府必須依法行政。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-14","section":"single","number":14,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 暐珠參加一場演講，聆聽一位逃離北韓的民眾分享自身經歷，摘要如下，其講述內容的意涵，應與下列何者最接近？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"民眾被政府嚴密控制，連居住處所也無法自由選擇，違反法律會受到嚴重處罰。我們辛苦的付出勞力，但常常得抓昆蟲充饑，而領導人卻像從沒挨餓過似的身材壯碩，他除了享受人民貢獻的豐碩成果，還擁有特權，法律根本無法規範他的行為。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)統治者不受法律約束，法律只用來限制人民　(Ｂ)在人治社會，法律是所有人唯一的依循標準　(Ｃ)不論在何種社會，法律地位永遠高於統治者　(Ｄ)必須依賴法律約束，才能促進社會安定和諧。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"由內容得知,北韓人民受到法律嚴格控管,但領導人的權力卻凌駕在法律之上。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：由內容得知，北韓人民受到法律嚴格控管，但領導人的權力卻凌駕在法律之上。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-15","section":"single","number":15,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 幾位同學正在討論人治社會和法治社會的區別，下列何人的說明最正確？　\n(Ａ)小祐：國家內設置皇室屬於人治社會，例如女王、天皇　(Ｂ)小崙：人治社會是以人民意見為依歸，保障人民的權利　(Ｃ)小康：法治社會中，政府權力受法律限制，須依法行政　(Ｄ)小濤：在法治社會，人民必須嚴格遵守統治者制定的法律。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"(A)並非以此做判斷(B)以統治者的喜好為主(D)法律是由人民選出代表制定的。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｃ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)並非以此做判斷(Ｂ)以統治者的喜好為主(Ｄ)法律是由人民選出代表制定的。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-16","section":"single","number":16,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 毅筑在一法律論壇看到附圖案例，根據內容判斷，下列何者說明較為正確？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"￰0￱","images":[],"inlineImages":[{"src":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiQAAAFkCAAAAAA1KH9dAAAAAmJLR0QAAKqNIzIAAAAMY21QUEpDbXAwNzEyAPgBA+rMYJUAAHPQSURBVHhe7b1tkFzXeR54JBowRWhwB7IEKtSgQdKxIC+6pxTKWbEw02taSlKs7pbKaztVme5NOZUtS9P9bxXVojs/VlZ+oMdbsnZ/BN2UvZv1VvEO8mOVdWl6JtyNSNO+PV4oFmlv30nksRNBcwEh1CgS5hKGTAFLYp/zde85957bfftrekjhlETMzD333PPxnve85/143nfdJ8Rpd8g7qlilRmaIAfkt2xui+k9U1VI1T8i77pOq/c4btrVWST2oXtFPXfcnsGKlDSIBjViNxXfU6G2Q/Xop5ZAojVSK8ylr/4RV6zUxOe13/VGR5Lasd9jY3YJv7aQc1HLPaqclqHfYNKUYjl9wyea72yTzjqMRkrtC/JSHaKdHGg9oJJFcLBBH+90dUku55VLQ3ZGpspwj3XSdcYlVS1fzJ7OW1SCddxPyzpJHxFKWSEpptPvOHP/kKBrkASJ5UB7MQP8ZeEAkDyhk4Aw8IJKBU/SgwgMieUADA2fgAZEMnKJDrOAe4reG+FRfIukU+/a6VdVvEPV67MOdZvAnr5l+Cvxy+J5xMM1yysvLEFNBq3rxi7NbTGXZ6hZT3rkNPZJjsZfKQ/Z3tOp+rKt+udWnqXfNka3lpOdFp9Ho8+6Sq+lq7Sp5PVo76wWtN5v5TdMESdKxcuHTbiHelPbuyT69ZhUTvhbvQNFRu4Xf1iNqI0NLnTZvx2qEfdbbGWrx6q3aGnuh3iqtD3zTVbZHbOVapimWTeZqwuxZ7uSeU2Ybz/tMOB6RuTnnflIpzF1KfIYHztxcIXy+tzC3Gq19MDd3IP+2Gn9MH12ak0V5GS33+/D9+/16zd68pHatX1sFr s":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"由內容可知,該國不屬於民主國家,是採取人治的治理方式。(A)(C)(D)皆屬於法治的治理方式。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：由內容可知，該國不屬於民主國家，是採取人治的治理方式。(Ａ)(Ｃ)(Ｄ)皆屬於法治的治理方式。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-21","section":"single","number":21,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"1.　領導人可以隨意修改《憲法》，以維持自己統治的正當性。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["D"],"explanation":"法治國家藉由法律保障人民的權利,以及限制政府的權力。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｄ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：法治國家藉由法律保障人民的權利，以及限制政府的權力。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-22","section":"single","number":22,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"2.　人民的行為受到法律約束，但執法機關不受法律規範。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["D"],"explanation":"(D)政府應依法行政,若有違法行為,人民可提起訴訟。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｄ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：(Ｄ)政府應依法行政，若有違法行為，人民可提起訴訟。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-23","section":"single","number":23,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"3.　人民沒有投票權，無法選出代表制定法律，為自己發聲。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)人民權利受到法律保障，不受任何侵害　(Ｂ)統治者的意思就是法律，用以鞏固權力　(Ｃ)政府執法有明確依據，依法執行公權力　(Ｄ)人民透過參與政治來維護自己的基本權益。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"在法治國家,人民與政府官員皆須受到法律約束。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：在法治國家，人民與政府官員皆須受到法律約束。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-24","section":"single","number":24,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 現代民主國家多採行「法治」，下列何者為法治國家的目的？　\n(Ａ)確保權力結構不受挑戰　(Ｂ)政府機關有絕對的控制力　(Ｃ)加速國家各項經濟發展　(Ｄ)保障人民在法律上受到平等對待。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"人民與政府都受到法律約束,不可違反《憲法》的精神,侵害到人民的基本權利。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｃ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：人民與政府都受到法律約束，不可違反《憲法》的精神，侵害到人民的基本權利。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-25","section":"single","number":25,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 本週公民課的討論主題為「建立法治社會」，下列四位同學提出的看法何人有誤？　\n(Ａ)喬喬：人民之行為，應依法為之　(Ｂ)阿植：國家的政府組織與職權，由法律定之　(Ｃ)小純：關於人民權利義務之事項，應以法律定之　(Ｄ)政府之行政行為若違法不當，人民不得提起爭訟。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"法治要求政府的所有行政措施都需有法律依據,並接受監督,以防止濫權。(A)(C)(D)都可能導致政府的權力過度擴張,違反法治精神。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：法治要求政府的所有行政措施都需有法律依據，並接受監督，以防止濫權。(Ａ)(Ｃ)(Ｄ)都可能導致政府的權力過度擴張，違反法治精神。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-26","section":"single","number":26,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 阿志喜歡出國旅遊，今年他在某國旅遊時，發現當地有法律明文規定，但卻因為身分不同而有差別待遇。例如：政府官員的車輛若違規，警察不會開罰單，普通市民則會受到法令處分。為此人民怨聲載道，但警察機關提出說明：「因為政府官員在為民工作，為國家發展，因此可以不受相關法規拘束。」在這個國家，此種執法方式可能會出現何種現象？　\n(Ａ)強化人民對政府的信任，提升政府效能　(Ｂ)造成社會不公平，導致人民對政府失去信心　(Ｃ)確保國家穩定，促進國家發展　(Ｄ)提高政府決策靈活度，國家秩序更穩定。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"(A)法治社會中,政府的權力受法律的約束;(C)法治社會的判定是依據政府權力是否受到法律約束;(D)法治社會中的統治者無法任意制定法律,故選(B)。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)法治社會中，政府的權力受法律的約束；(Ｃ)法治社會的判定是依據政府權力是否受到法律約束；(Ｄ)法治社會中的統治者無法任意制定法律，故選(Ｂ)。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-27","section":"single","number":27,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 某國一位時事評論者公開表示：「此法案將造成『人民透過選舉選出代為處理政治事務者，當其不適任時，卻無法用投票方式使其去職。』若此法案貿然通過，不僅侵害《憲法》所保障的參政權，最終亦將被憲法法庭判決無效。站在民主法治的立場上，請負責制定法律的立法機關審慎思考，做出適當的決定。」下列何者符合該位評論者想要表達的意旨？　\n(Ａ)《憲法》保障人民的基本權利，但無法規範立法者的權力　(Ｂ)為維持國家的長治久安，政府施政可適當偏離《憲法》　(Ｃ)政府機關的權力受到法律規範，應尊重《憲法》的精神　(Ｄ)擴張權力可鞏固統治者的地位，以法律控制人民的行為。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"在法治社會,政府是法律的執行者,必須依法行政,與人民一樣都必須遵守法律。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：在法治社會，政府是法律的執行者，必須依法行政，與人民一樣都必須遵守法律。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-28","section":"single","number":28,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 2024　年　12　月，南韓總統在深夜緊急宣布戒嚴，6　小時之後戒嚴被國會議員火速否決，引發政治、經濟動盪。在野黨議員表示：「總統的戒嚴宣布完全不符合《憲法》與法律所規定的實質條件，是非法且違憲的行為。」根據上述新聞判斷，下列何者最能體現法治國家的核心精神？　\n(Ａ)政府不需遵守法律，法律只約束人民的行為　(Ｂ)政府的所有行政措施均需有法律依據並受監督　(Ｃ)法律鞏固統治者的權力，成為限制人民的工具　(Ｄ)法律由政府制定，可無條件限制人民的權利。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["D"],"explanation":"政府有執行政策的公權力要求人民配合,但必須依法有據。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｄ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：政府有執行政策的公權力要求人民配合，但必須依法有據。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-29","section":"single","number":29,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 「法治」是現代社會所強調的重要概念，臺灣現行的法條已有上萬條之多，規範著生活中許多大大小小的事情。下列關於「法治」的敘述，何者正確？　\n(Ａ)法律無法約束政府的權力　(Ｂ)人民的權利受到基本的保障　(Ｃ)只要有制定法律就是法治社會　(Ｄ)統治者可依照自身喜好制定法律。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"(A)應是權力(B)應是權利(D)須受法律規範。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｃ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：(Ａ)應是權力(Ｂ)應是權利(Ｄ)須受法律規範。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-30","section":"single","number":30,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 安樂國政府規定，所有法律的制定都必須經過國會審查通過，再由行政機關執行，不管人民還是政府機關執政，都須遵守法律。上述安樂國是以何種原則治國？　\n(Ａ)人治原則　(Ｂ)法治原則　(Ｃ)獨裁統治　(Ｄ)武力決策原則。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"由資料可知該國屬於人治社會,因人民無法表達民意,法律只是統治者用來限制人民的工具。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｃ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：由資料可知該國屬於人治社會，因人民無法表達民意，法律只是統治者用來限制人民的工具。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-31","section":"single","number":31, 4jBBoSecxrno75xYCLQRaCHxmEPiHn1nPbcctBD7HEPiH/z9djQnNiSq6YwAAAABJRU5ErkJggg==","legacy":false,"ext":"png","rid":"rId13"}],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)為顧及公眾利益，政府必要時可違反法律　(Ｂ)人民應參與定期選舉，選出代表制定法律　(Ｃ)政黨應以民意為基礎，推動政府進行改革　(Ｄ)人民必須遵守法律，但政府亦應依法行政。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"甲資料顯示該國為人治社會,統治者可強行徵召人民修鑿運河。乙資料則為法治社會,政府重大施政須召開公聽會傾聽民意,故選(B)。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：甲資料顯示該國為人治社會，統治者可強行徵召人民修鑿運河。乙資料則為法治社會，政府重大施政須召開公聽會傾聽民意，故選(Ｂ)。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-32","section":"single","number":32,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 根據《警察勤務條例》第　11　條規定：「臨檢：於公共場所或指定處所、路段，由服勤人員擔任臨場檢查或路檢，執行取締、盤查及有關法令賦予之勤務。」但警察執法時亦不能逾越必要程度，以免侵害《憲法》保障人民的人身自由權。由上述判斷，下列說明何者最正確？　\n(Ａ)法律落實警察對人民的臨檢權利　(Ｂ)法律保障人民身上的自由權力　(Ｃ)執法單位與人民均受到法律約束　(Ｄ)警察機關執行勤務不受法律規範。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"在人治社會中,法律被當作限制人民的工具,人民的權利無法獲得保障。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：在人治社會中，法律被當作限制人民的工具，人民的權利無法獲得保障。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-33","section":"single","number":33,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 韻婷和同組同學搜尋了某個國家的資料，根據以下內容判斷，關於該國現況的敘述，下列何者正確？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"◎《朝鮮民主主義人民共和國社會主義憲法》目前共進行　8　次修憲。除此之外，國內有　200　部以上法規正在施行。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"◎國家與社會重要政策只有領導人掌控絕對的決策權，包含制定法律、對人民生活的管控措施等。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"◎人民無法參與政治，或是透過選舉選出代表民意的首長及公職人員。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)國家制定實施多項法律規範，屬於法治社會　(Ｂ)政府依法行政，透過公權力保障人民基本權益　(Ｃ)統治者的意思就是法律，以自身好惡統治人民　(Ｄ)《憲法》成為政府與人民共同遵守的最高規範。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"法治的核心精神在於保障人民的基本權利,並限制政府的權力。《憲法》是位階最高的法律,最能體現法治的精神。(A)(C)(D)雖然與法律運作相關,但不能直接區分法治與人治。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：法治的核心精神在於保障人民的基本權利，並限制政府的權力。《憲法》是位階最高的法律，最能體現法治的精神。(Ａ)(Ｃ)(Ｄ)雖然與法律運作相關，但不能直接區分法治與人治。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-34","section":"single","number":34,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 甲、乙二則資料呈現不同時代官方興建公共建設的相關情況：","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"甲資料：統治者為了加強對國內各地的控制，便於運送物資及兵力，下令修鑿運河，強行徵召數百萬人民從事勞役。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"乙資料：某地方政府研擬興建社會住宅，當地議會要求依法召開公聽會聽取附近居民的意見，作為後續制定政策的參考。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"根據甲、乙二項資料判斷，關於不同時代官方興建公共建設作法的敘述，下列何者最適當？【114　年會考】　\n(Ａ)甲資料顯示當時的市場勞動權利受法律保障　(Ｂ)乙資料顯示當時的政府權力受到約束與制衡　(Ｃ)二則資料皆顯示公共建設以促進公平正義為主要考量　(Ｄ)二則資料皆顯示公共意見是經由大眾反覆討論而形成。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"根據題目,該國國王可以隨時更改法律,依喜好統治人民,屬於人治。(A)法律由一人決定,屬於人治;(C)並非有法律存在就屬於法治,須視法律是否能約束政府,保障人民權利;(D)文中未提及人民可參與法律制定,故選(B)。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：根據題目，該國國王可以隨時更改法律，依喜好統治人民，屬於人治。(Ａ)法律由一人決定，屬於人治；(Ｃ)並非有法律存在就屬於法治，須視法律是否能約束政府，保障人民權利；(Ｄ)文中未提及人民可參與法律制定，故選(Ｂ)。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-35","section":"single","number":35,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 法王路易十四曾宣稱「朕即國家」，他擁有絕對的權威，意志即是法律。在當時的法國，國王可以不經審判就簽發「密札」（歷史上指私密下達的官方文書或指令）逮捕臣民。有關上述內容，下列敘述何者正確？　\n(Ａ)當時的法國符合人治社會的特徵　(Ｂ)國王體現了法律規範政府權力的精神　(Ｃ)路易十四簽發密札逮捕臣民是在行使權利　(Ｄ)人民是在法律框架下被逮捕，基本權利已獲得保障。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"(C)為權利(人民所應享有的生活利益,且不受非法侵害)(A)(B)(D)為權力(國家機關依法行使公權力,是支配的力量)。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｃ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：(Ｃ)為權利（人民所應享有的生活利益，且不受非法侵害）(Ａ)(Ｂ)(Ｄ)為權力（國家機關依法行使公權力，是支配的力量）。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-36","section":"single","number":36,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 在法治國家中，法律須保障人民的權利，並約束執政者的作為。下列何者最能區分法治與人治的差異？　\n(Ａ)法律是否由國會制定　(Ｂ)是否有《憲法》保障人民的權利　(Ｃ)是否有法律規範人民的行為　(Ｄ)是否有健全的法律位階制度。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"法律無法規範執政者的行為,甚至被濫用以防止人民爭取自身權利。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：法律無法規範執政者的行為，甚至被濫用以防止人民爭取自身權利。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-37","section":"single","number":37,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 在某個國家，國王擁有絕對的權力，所有政策和法律都由他一人決定。他可以隨意更改法律，根據自己的喜好懲罰或獎勵人民，而人民無法對他的決定提出異議。即使國家原本有法律，國王仍然可以隨時修改或忽視，讓法律變得毫無固定標準。下列關於該國治理方式的敘述，何者正確？　\n(Ａ)屬於法治，因為國王是國家的領導者，所有法律都由他決定　(Ｂ)屬於人治，因為法律並非根據客觀標準，而是經由國王決定　(Ｃ)屬於法治，因為國家仍然有法律的存在，可以限制國王權力　(Ｄ)屬於人治，因為人民可以參與法律的制定，由人民決定法律。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"題幹描述選舉不公、權力集中,以及政府濫用法律打壓異議,顯示法律並未用來約束統治者,反而成為其維持權力的工具,故選(A)。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：題幹描述選舉不公、權力集中，以及政府濫用法律打壓異議，顯示法律並未用來約束統治者，反而成為其維持權力的工具，故選(Ａ)。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-38","section":"single","number":38,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 附表為四位同學各自分享生活中觀察到的一種情況，作為說明「權利」或「權力」的例子。根據表中內容判斷，何人舉例的性質與其他三者不同？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"table","rows":[[{"text":"同學","inlineImages":[]},{"text":"舉例","inlineImages":[]}],[{"text":"志宏","inlineImages":[]},{"text":"市政府依據相關法規，要求餐飲業者定期接受衛生檢查，違規者將依法處罰。","inlineImages":[]}],[{"text":"雅婷","inlineImages":[]},{"text":"警方依據檢舉資料，依法對涉嫌詐騙的集團進行搜索與逮捕行動。","inlineImages":[]}],[{"text":"俊傑","inlineImages":[]},{"text":"某公司未依法給付加班費，員工向勞工主管機關申訴，要求補發薪資。","inlineImages":[]}],[{"text":"宜芳","inlineImages":[]},{"text":"立法院通過新法，規定公共場所全面禁菸，違者將處以罰鍰。","inlineImages":[]}]],"placement":"stem","source":"word-native-table"},{"kind":"p","text":"(Ａ)志宏　(Ｂ)雅婷　(Ｃ)俊傑　(Ｄ)宜芳。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"採用「人治」,領導人依自己好惡統治人民,若有所偏頗,無法公正無私,將對人民權利造成侵害。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ａ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：採用「人治」，領導人依自己好惡統治人民，若有所偏頗，無法公正無私，將對人民權利造成侵害。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-39","section":"single","number":39,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 郁浩正在中南美洲某國家旅遊，根據以下他所分享的內容判斷，關於該國政治現況的敘述，下列何者正確？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"限時動態","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"總統大選爆出嚴重舞弊，不公正的選舉使得領導人繼續把持政權，濫用權力安插自己人，以確保得到立法機關和司法機關的絕對支持。法律對執政者而言形同虛設，甚至縱容執法者以違法叛亂為名，逮捕反對威權的抗議民眾。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)法律是統治者限制人民的工具　(Ｂ)政府受到法律約束，依法行政　(Ｃ)人民經由民主選舉獲得參政權　(Ｄ)政府透過公權力保障人民權益。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"在法治社會,政府不得擴張權力侵害人民的權利。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｂ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：在法治社會，政府不得擴張權力侵害人民的權利。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-40","section":"single","number":40,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 小廷在某國家旅行時，於社群媒體上分享其觀察：「該國最近的選舉過程充滿爭議，執政者被指控操控選舉結果以延續其統治地位。此外，政府高層大量任用親信掌控國會與法院，使權力高度集中。當民眾上街抗議時，當局常以『危害國家安全』為由進行逮捕與壓制，甚至忽視基本法律程序。」根據上述情況，判斷該國政治體制的特徵，下列何者最為適當？　\n(Ａ)法律被執政者操控，成為壓制人民的手段　(Ｂ)國家運作是依循法治原則，政府依法施政　(Ｃ)公民能夠透過公平選舉實現政治參與權利　(Ｄ)政府積極運用權力以保障人民自由與安全。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["D"],"explanation":"「權力」指個人或團體具備優勢資源,以強制力量影響他人行為;「權利」指在法律保障下,人民享有追求利益且避免受侵害的權益,故選(D)。(A)政府權力的行使必須受到法律嚴格約束,不得任意行政(B)兩者定義剛好顛倒(C)這是「人治」社會的特徵,而非民主法治國家的權利與權力關係。","answerNote":"","mathEquationCount":0,"answerParts":[{"kind":"p","text":"答案：(Ｄ)","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}],"explanationParts":[{"kind":"p","text":"解析：「權力」指個人或團體具備優勢資源，以強制力量影響他人行為；「權利」指在法律保障下，人民享有追求利益且避免受侵害的權益，故選(Ｄ)。(Ａ)政府權力的行使必須受到法律嚴格約束，不得任意行政(Ｂ)兩者定義剛好顛倒(Ｃ)這是「人治」社會的特徵，而非民主法治國家的權利與權力關係。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"single-41","section":"single","number":41,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 以下是一位外國知名公眾人物接受媒體訪問的摘要，根據內容判斷，他所反對的治理方式，是因其可能產生何種問題？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"○○地區不能採用「人治」。政府的治理必須奠基在法律基礎之上，政府的權力是由人民授予，政府施政應該公平公正，一視同仁，不能因為領導人的好惡而受到影響。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)人民的權利無法獲得保障　(Ｂ)人民的行為受到法律約束　(Ｃ)政府成為公權力的執行者　(Ｄ)領導人無法有效行使職權。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":[],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"single-42","section":"single","number":42,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 金勇國最近發布一項新政策，要求全數國人住家皆須安裝監視器，以利政府治安管理；此政策一公布，部分人民認為政府侵害他們的權利，遂提出抗議。針對金勇國此項新政策，下列何項說明較符合民主社會的做法？　\n(Ａ)為社會安全秩序，政府可強制執行　(Ｂ)召開公聽會，蒐集民眾意見再行決策　(Ｃ)應全面取消此政策，避免侵害人民隱私權　(Ｄ)規定人民服從政府政策，違者將取締開罰。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":[],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"single-43","section":"single","number":43,"sub":null,"groupId":null,"parts":[{"kind":"p","text":"(   ) 警察小碩在路邊依法攔下騎士阿強進行酒駕臨檢，這是執行國家賦予的「強制力量」以維護社會秩序；隨後小碩因懷疑阿強非法持有毒品，在未取得其同意且無正當法律程序下試圖直接搜身，阿強隨即依法拒絕，以保障個人「生活利益」不受非法侵害。上述兩人的行為，分別體現法治國家的「權力」與「權利」兩個核心軸心，下列相關分析何者正確？　\n(Ａ)權力：其行使不受法律約束；權利：僅限於免受政府侵害的自由　(Ｂ)權力：指人民受法律保障的權益；權利：指政府具有優勢資源的強制力　(Ｃ)權力：目的是為了鞏固統治者地位；權利：是統治者恩賜給人民的工具　(Ｄ)權力：指能影響他人行為的力量；權利：指在法律保障下享有追求利益的權益。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":[],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"group-1-1","section":"group","number":1,"sub":1,"groupId":"group-1","parts":[{"kind":"p","text":"（　）(１)上文的報告提到全球多國法治退化現象的主要表現為何？　(Ａ)增加法律透明度　(Ｂ)法律成為統治工具　(Ｃ)強化人權保障　(Ｄ)增強人民自由。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"報告指出,部分國家利用法律鞏固統治者的權力,這表現出法治退化的關鍵特徵。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"解析：(１)報告指出，部分國家利用法律鞏固統治者的權力，這表現出法治退化的關鍵特徵。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-1-2","section":"group","number":1,"sub":2,"groupId":"group-1","parts":[{"kind":"p","text":"（　）(２)根據報告中的說法，法治的核心價值為何？　(Ａ)增加政府權力　(Ｂ)保障人民的基本權利　(Ｃ)限制人民的自由　(Ｄ)集中法律解釋權。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"由報告內容可知,法治的核心價值在於保障人民的基本權利,而非擴大政府的權力或限制人民的自由。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"(２)由報告內容可知，法治的核心價值在於保障人民的基本權利，而非擴大政府的權力或限制人民的自由。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-2-1","section":"group","number":2,"sub":1,"groupId":"group-2","parts":[{"kind":"p","text":"（　）(１)對於上述國家體制的描述，下列何者正確？　(Ａ)人民不受法律約束　(Ｂ)政府推崇憲政體制　(Ｃ)法律由統治者控制　(Ｄ)司法權是最高權力。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"領導人把法律作為管控工具,為達到獨裁目的,甚至修改《憲法》。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"解析：(１)領導人把法律作為管控工具，為達到獨裁目的，甚至修改《憲法》。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-2-2","section":"group","number":2,"sub":2,"groupId":"group-2","parts":[{"kind":"p","text":"（　）(２)根據上文，與民主國家相較，該國《憲法》缺乏何種精神？　(Ａ)促進文化交流　(Ｂ)消弭族群衝突　(Ｃ)重視國土開發　(Ｄ)保障人民權利。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["D"],"explanation":"《憲法》是國家根本大法,應視人權保障為最高原則,但中國的《憲法》卻將中國共產黨置於人民之上。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"(２)《憲法》是國家根本大法，應視人權保障為最高原則，但中國的《憲法》卻將中國共產黨置於人民之上。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-3-1","section":"group","number":3,"sub":1,"groupId":"group-3","parts":[{"kind":"p","text":"（　）(１)根據上文，對於紀錄片中顯示的情境，下列敘述何者正確？　(Ａ)政府依法行政，維持社會秩序穩定　(Ｂ)人民權利受到侵害，無法獲得伸張　(Ｃ)公權力來自民意授權，具有強制性　(Ｄ)人民不滿政府施政，違抗法律規定。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"由文中可知公權力與人民站在對立面,人民無法依循法律途徑維護自身權益。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"解析：(１)由文中可知公權力與人民站在對立面，人民無法依循法律途徑維護自身權益。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-3-2","section":"group","number":3,"sub":2,"groupId":"group-3","parts":[{"kind":"p","text":"（　）(２)若要避免導演所說民主國家社會可能發生的變化，下列何項建議較適當？　(Ａ)擴大政府權力，限制人民的自由權　(Ｂ)人民與政府都必須受到法律的約束　(Ｃ)發起社會運動，訴諸媒體表達意見　(Ｄ)隨時修訂法律制度，適應社會變遷。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"政府若權力過大,恐對人民權利造成侵害,因此人民與政府均應遵守法律,且政府的權力須受到法律限制。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"(２)政府若權力過大，恐對人民權利造成侵害，因此人民與政府均應遵守法律，且政府的權力須受到法律限制。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-4-1","section":"group","number":4,"sub":1,"groupId":"group-4","parts":[{"kind":"p","text":"（　）(１)上述提到的人治與法治，其主要區別為何？　(Ａ)法律是否保障統治者權力　(Ｂ)法律是否約束人民行為　(Ｃ)法律是否可以隨意變更　(Ｄ)法律是否保障人民權利。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["D"],"explanation":"李嘉誠指出,人治使法律成為統治者的工具,無法保障人民權利,而法治的核心精神在於保障人民的權利。(A)(B)(C)無法正確區分人治與法治。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"解析：(１)李嘉誠指出，人治使法律成為統治者的工具，無法保障人民權利，而法治的核心精神在於保障人民的權利。(Ａ)(Ｂ)(Ｃ)無法正確區分人治與法治。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-4-2","section":"group","number":4,"sub":2,"groupId":"group-4","parts":[{"kind":"p","text":"（　）(２)由李嘉誠的言論判斷，法治的主要功能為何？　(Ａ)提高法律靈活性　(Ｂ)限制政府的權力　(Ｃ)增強統治者的控制力　(Ｄ)減少人民的自由。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"法治應成為保障香港人民權利與限制政府權力的工具。","answerNote":"","mathEquationCount":0,"explanationParts":[{"kind":"p","text":"(２)法治應成為保障香港人民權利與限制政府權力的工具。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_6157abdf-517a-440d-9365-2c1f0a490a79"}]},{"id":"group-5-1","section":"group","number":5,"sub":1,"groupId":"group-5","parts":[{"kind":"p","text":"（　）(１)從文中對獨裁者的描述來看，下列何者最符合「獨裁者」常用的統治方法？　(Ａ)與人民保持良好溝通，確保政策符合民意　(Ｂ)推行符合人民需求的政策，保障人民福祉　(Ｃ)控制法律以擴張權力，限制人民基本權利　(Ｄ)讓媒體監督政府，鼓勵人民參與政策討論。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["C"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"group-5-2","section":"group","number":5,"sub":2,"groupId":"group-5","parts":[{"kind":"p","text":"（　）(２)在強調「法治」的社會，下列針對國家領導人或官員的敘述，何者最適當？　(Ａ)無論身分或地位，都應該和人民一樣遵守法律規定　(Ｂ)只要領導人民意支持度高，就不需追究其法律責任　(Ｃ)為了國家穩定，可由領導人自行衡量是否接受懲罰　(Ｄ)領導人可以頒布特別的法律規定，不受到法律約束。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"group-5-3","section":"group","number":5,"sub":3,"groupId":"group-5","parts":[{"kind":"p","text":"(３)若一個社會長期處於「人治」的氛圍，可能對個人或整體社會帶來哪些負面影響？","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"答：","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":[],"explanation":"","answerNote":"參考答案:政府或領導人因缺乏監督,容易導致政府濫權,人民權利被侵害,民主價值流失。","mathEquationCount":0},{"id":"match-1-1","section":"match","number":1,"sub":1,"groupId":"match-1","parts":[{"kind":"p","text":"（　）(１)大選在即，民眾紛紛返鄉，將神聖的一票投給心目中理想的候選人。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-1-2","section":"match","number":1,"sub":2,"groupId":"match-1","parts":[{"kind":"p","text":"（　）(２)政府要求逃漏稅的民眾限期繳納稅款，並依所漏稅額開出罰單。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-1-3","section":"match","number":1,"sub":3,"groupId":"match-1","parts":[{"kind":"p","text":"（　）(３)司法單位限制犯罪嫌疑人自由出境、出海，防止其藉機潛逃出境。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-1-4","section":"match","number":1,"sub":4,"groupId":"match-1","parts":[{"kind":"p","text":"（　）(４)民眾與商家發生消費糾紛，決定採取訴訟程序，爭取受損權益。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-2-1","section":"match","number":2,"sub":1,"groupId":"match-2","parts":[{"kind":"p","text":"（　）(１)法律就是統治者的意思。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-2-2","section":"match","number":2,"sub":2,"groupId":"match-2","parts":[{"kind":"p","text":"（　）(２)統治者不需遵守法律。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-2-3","section":"match","number":2,"sub":3,"groupId":"match-2","parts":[{"kind":"p","text":"（　）(３)法律限制政府的權力。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-2-4","section":"match","number":2,"sub":4,"groupId":"match-2","parts":[{"kind":"p","text":"（　）(４)人民的權利無法受到保障。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-2-5","section":"match","number":2,"sub":5,"groupId":"match-2","parts":[{"kind":"p","text":"（　）(５)政府執法有明確依據法律。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["B"],"explanation":"","answerNote":"","mathEquationCount":0},{"id":"match-2-6","section":"match","number":2,"sub":6,"groupId":"match-2","parts":[{"kind":"p","text":"（　）(６)法律規定隨著統治者的想法而改變。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}],"correct":["A"],"explanation":"","answerNote":"","mathEquationCount":0}],"groups":{"group-1":{"id":"group-1","section":"group","number":1,"parts":[{"kind":"p","text":" 2023　年度人權報告指出，全球多國以法律之名限制人民自由，法治退化、人治抬頭的現象嚴重。部分國家修改法律以鞏固統治者的權力，侵害人民的基本權利。報告強調，法治是保障人權的基石，各國應加強法律的透明度與獨立性，避免法律成為壓迫人民的工具。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}]},"group-2":{"id":"group-2","section":"group","number":2,"parts":[{"kind":"p","text":" 中國領導人近來於多場重要會議中做出指示，他認為中國絕對不能像西方國家一樣推行憲政體制，中國不走司法獨立的路，而必須要由中國共產黨領導立法，主導國家發展道路，讓法律成為管控社會和人民的有力工具，並在　2018　年修憲時，將中國共產黨明列在《憲法》第一條條文：「中國共產黨是全中國人民的領導核心。」","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}]},"group-3":{"id":"group-3","section":"group","number":3,"parts":[{"kind":"p","text":" 　　日本一導演拍攝紀錄片《消失的律師》，內容關於某國家近幾年來約有　300　名律師，為了維護公民基本權益發聲辯護，卻突然無故失蹤，至今生死不明的事件。這些律師為弱勢群體爭取權益、抗議政府不當施政的舉動，觸及官方的敏感神經，而導致他們「被」消失。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"　　政府動用公權力阻撓家屬依法尋人的各種請求，甚至採取違法粗暴方式限制其人身自由，影片記載了他們四處奔波、求助無門的過程和心路歷程。導演希望透過不帶任何立場的寫實報導讓世界了解該國的政治社會現況，同時也讓他有感而發，如果有朝一日民主國家的政府權力無法受到規範，人民已擁有的基本權利將會面臨崩解。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}]},"group-4":{"id":"group-4","section":"group","number":4,"parts":[{"kind":"p","text":" 2013　年香港首富李嘉誠認為在健康社會中，政府與企業的關係是息息相關的，關鍵是政府的權力要在法治的基礎上公平公正地落實執行政策，香港不能「人治」，永遠不能選擇性行使權力。他還語重心長的呼籲政府應加強法治建設，讓法律成為保障香港人民的工具。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}]},"group-5":{"id":"group-5","section":"group","number":5,"parts":[{"kind":"p","text":" 在西班牙繪本《這就是獨裁者》中提到：","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"說話的這位先生，就是下命令的人。他是所有人的主人，因為他把自己變成「所有一切」的主人。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"所有的獨裁體制都不准人思考，只能思考獨裁者認為可以思考的事情。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"　　在獨裁國家，政治權力由一位或少數的獨裁者掌握。獨裁者透過恐嚇迫使人民沉默，並控制媒體讓資訊不公開。表面上，他會宣稱所有決定都是「為了人民好」，事實上，他只是利用「人治」的方式，將法律與制度踩在腳下。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"　　相較之下，「法治」社會強調「依法而治」，領導人必須遵守法律，並透過民主程序避免權力集中在少數人。假若一個國家自稱「民主」，但缺乏公平的選舉，公民的權利受限，甚至有官員濫權等情況，便容易淪為「假民主」。在真正的民主體制下，人們能依循憲法和法律來保障自身權益，也能有效監督執政者。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}]},"match-1":{"id":"match-1","section":"match","number":1,"parts":[{"kind":"p","text":" 權力與權利是法治社會的兩個軸心，請根據以下情境，將正確答案代號填入空格中。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)權力　(Ｂ)權利","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}]},"match-2":{"id":"match-2","section":"match","number":2,"parts":[{"kind":"p","text":" 人治社會與法治社會的狀況不同，請根據下列敘述，填入正確的答案代號。","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":true,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"},{"kind":"p","text":"(Ａ)人治社會　(Ｂ)法治社會","images":[],"inlineImages":[],"mathEquationCount":0,"numbered":false,"fieldNumber":null,"style":"Normal_90260f24-ae9e-4aca-a66f-2a356b9efcb8"}]}},"sections":["single","group","match"],"warnings":["有 4 題未找到 A/B/C/D 型選項；請檢查其題型。","解答卷未配對到 3 個題目／子題，請確認題號及大項。"],"mathImportReport":{"restored":0,"unresolved":0,"vector":0},"answerSource":"國中社會_3-1人治與法治-解析卷簡.docx"}</script>

function cellsToTable(rows,caption='',source='manual-table'){
 const clean=(rows||[]).map(row=>(row||[]).map(v=>({text:String(v??'').trim(),images:[],inlineImages:[]})));
 const width=Math.max(0,...clean.map(r=>r.length));
 if(!width||clean.length<1||width>18||clean.length>120) return null;
 return {kind:'table',rows:clean.map(row=>[...row,...Array.from({length:width-row.length},()=>({text:'',images:[],inlineImages:[]}))]),caption:String(caption||''),source,placement:'stem'};
}
function tableAsTSV(table){return (table?.rows||[]).map(row=>row.map(cell=>String(cell.text||'').replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n')}
function tsvAsTable(text,caption=''){
 let lines=String(text||'').trim().replace(/\r/g,'').split('\n').filter(line=>line.trim());
 if(!lines.length)return null;
 if(lines.length>120)throw Error('表格超過 120 列，請分拆');
 const cells=lines.map(line=>line.split('\t').map(x=>x.trim()));
 if(Math.max(...cells.map(row=>row.length))>18)throw Error('表格超過 18 欄，請分拆');
 return cellsToTable(cells,caption,'teacher-edited-table')
}
function findStemTable(q){return(q?.parts||[]).find(p=>p.kind==='table'&&p.placement!=='option')||null}

/* 10.0 將系統產生的 WMF 向量公式收緊至可見筆畫範圍，保留 SVG 清晰度。
   僅限安全白名單的本系統 SVG；其他圖片維持原樣。 */
const mathVectorLayoutCache=new Map();
function compactLegacySvg(source){
 if(!source||!source.startsWith('data:image/svg+xml;base64,'))return source;
 if(mathVectorLayoutCache.has(source))return mathVectorLayoutCache.get(source);
 let fitted=source;
 try{
  const binary=atob(source.slice(source.indexOf(',')+1));
  if(binary.length>400000)throw Error('large SVG');
  const markup=new TextDecoder().decode(Uint8Array.from(binary,c=>c.charCodeAt(0)));
  // 只處理自動 WMF 轉出且沒有外部資源或可執行標記的 SVG。
  if(!markup.includes('<g stroke-linecap="round" stroke-linejoin="round">')||/<(?:script|foreignObject|image|use|style|animate|set)\b|\bon[a-z]+\s*=|(?:xlink:)?href\s*=|url\s*\(/i.test(markup))throw Error('unsupported SVG');
  const doc=new DOMParser().parseFromString(markup,'image/svg+xml'),root=doc.documentElement;
  if(root.localName!=='svg'||root.querySelector('parsererror'))throw Error('bad SVG');
  for(const el of root.querySelectorAll('*'))if(!['g','path','polyline','rect','text'].includes(el.localName))throw Error('unsafe SVG node');
  const probe=document.importNode(root,true);
  probe.style.cssText='position:absolute;left:-99999px;top:-99999px;visibility:hidden;pointer-events:none';
  probe.setAttribute('width','250');probe.setAttribute('height','250');
  document.body.appendChild(probe);
  let box;
  try{box=probe.querySelector('g').getBBox()}finally{probe.remove()}
  if(!box||!isFinite(box.width)||!isFinite(box.height)||box.width<1||box.height<1||box.width>40000||box.height>40000)throw Error('invalid bbox');
  const pad=Math.max(7,Math.max(box.width,box.height)*.065),x=box.x-pad,y=box.y-pad,w=box.width+2*pad,h=box.height+2*pad;
  root.setAttribute('viewBox',[x,y,w,h].map(n=>Number(n.toFixed(2))).join(' '));
  root.setAttribute('width',String(Math.max(12,Math.round(100*w/h))));root.setAttribute('height','100');
  const out=new XMLSerializer().serializeToString(root);
  fitted='data:image/svg+xml;base64,'+btoa(Array.from(new TextEncoder().encode(out),b=>String.fromCharCode(b)).join(''));
 }catch(e){fitted=source}
 // 來源與輸出皆使用圖片，不轉成網頁中可執行的 SVG 內容。
 if(mathVectorLayoutCache.size>2200)mathVectorLayoutCache.clear();
 mathVectorLayoutCache.set(source,fitted);
 return fitted;
}

}
/* 安全的數學文字排版：教師可輸入 LaTeX 的 frac / dfrac / sqrt，使用瀏覽器原生 MathML。 */
/* APP20: preserve true Word super/subscripts, and render algebra with mathematical typesetting.
   Render only formula-like spans, not ordinary 2 in dates/question numbers. */
function algebraMathML(expression){
 const txt=String(expression||'').replace(/[＋]/g,'+').replace(/[－−]/g,'−').replace(/[＝]/g,'=')
   .replace(/[（]/g,'(').replace(/[）]/g,')').replace(/[×]/g,'×').replace(/[÷]/g,'÷');
 const powerDigits={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
 const opens=new Set(['(','[','{']),closes={')':'(',']':'[','}':'{'},frames=[{open:'',tokens:[]}];
 const wrap=t=>'<mrow>'+t.join('')+'</mrow>',put=x=>frames[frames.length-1].tokens.push(x);
 for(let i=0;i<txt.length;){
  const ch=txt[i];
  if(opens.has(ch)){frames.push({open:ch,tokens:[]});i++;continue}
  if(closes[ch]&&frames.length>1&&frames[frames.length-1].open===closes[ch]){
   const frame=frames.pop();put('<mrow><mo>'+esc(frame.open)+'</mo>'+wrap(frame.tokens)+'<mo>'+esc(ch)+'</mo></mrow>');i++;continue;
  }
  if(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(ch)||ch==='^'){
   let p='';if(ch==='^'){
    i++;if(txt[i]==='{'){i++;while(i<txt.length&&txt[i]!=='}'){p+=txt[i++]}if(txt[i]==='}')i++}
    else while(i<txt.length&&/[0-9n+-]/.test(txt[i]))p+=txt[i++];
   }else {while(i<txt.length&&powerDigits[txt[i]]!==undefined)p+=powerDigits[txt[i++]]}
   if(p&&frames[frames.length-1].tokens.length){const prev=frames[frames.length-1].tokens.pop();put('<msup>'+prev+'<mn>'+esc(p)+'</mn></msup>')}
   else put('<mtext>'+esc(ch)+'</mtext>');continue;
  }
  if(/[0-9]/.test(ch)){let j=i+1;while(j<txt.length&&/[0-9.]/.test(txt[j]))j++;put('<mn>'+esc(txt.slice(i,j))+'</mn>');i=j;continue}
  if(/[a-zA-Zαβγπθ]/.test(ch)){put('<mi>'+esc(ch)+'</mi>');i++;continue}
  if(/\s/.test(ch)){put('<mspace width=".16em"/>');i++;continue}
  put('<mo>'+esc(ch)+'</mo>');i++;
 }
 while(frames.length>1){const f=frames.pop();frames[frames.length-1].tokens.push('<mo>'+esc(f.open)+'</mo>',...f.tokens)}
 return '<span class="math-fraction math-universal algebra-inline" role="math" aria-label="'+esc(expression)+'"><math xmlns="http://www.w3.org/1998/Math/MathML" display="inline">'+wrap(frames[0].tokens)+'</math></span>';
}
function algebraFormattedText(value){
 const s=String(value??'');
 // First isolate likely algebra runs. A plain numeral or a date is never a power.
 const rx=/[A-Za-z0-9αβγπθ（(][A-Za-z0-9αβγπθ＋+－−\-×÷＝=（）()\[\]{}⁰¹²³⁴⁵⁶⁷⁸⁹^·.]*[A-Za-z0-9αβγπθ）)⁰¹²³⁴⁵⁶⁷⁸⁹]/g;
 let out='',pos=0,m;
 while((m=rx.exec(s))){
  const candidate=m[0];
  // Mathematical variable + an operation/power; prevent matching ordinary prose or A/B labels.
  const isFormula=/[a-zA-Zαβγπθ]/.test(candidate)&&/[+＋−－\-＝=×÷⁰¹²³⁴⁵⁶⁷⁸⁹^]/.test(candidate)&&
    (/[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]/.test(candidate)||/[+＋−－\-=＝]/.test(candidate))&&
    !/^[A-Za-z]{3,}\d*$/.test(candidate);
  if(!isFormula)continue;
  out+=esc(s.slice(pos,m.index)).replace(/\n/g,'<br>')+algebraMathML(candidate);pos=rx.lastIndex;
 }
 return out+esc(s.slice(pos)).replace(/\n/g,'<br>');
}
function mathFormattedText(s){
 // MathML retains superscript and correct alignment in the question, options, and explanations.
 // TeX is handled by the existing universal engine; non-maths subjects retain the old behavior.
 return (typeof bank!=='undefined'&&bank?.subject==='數學'&&!/\\[A-Za-z]+/.test(String(s)))
   ?algebraFormattedText(s):universalMathFormattedText(s);
}

function studySteps(q){
 const steps=[];
 if(q.studyTip?.trim())steps.push({html:'<p>'+textHtml(q.studyTip)+'</p>',title:'老師補充提醒'});
 // The original Word paragraphs preserve OMML, MathType converted drawings, tables and line order.
 const parts=(q.explanationParts||[]).filter(p=>p.kind==='table'||String(p.text||'').trim()||p.inlineImages?.length||p.images?.length);
 if(parts.length){
  for(const p of parts){
   if(p.kind==='table'){steps.push({html:partHTML(p),title:'圖表／解題資料'});continue}
   const pieces=String(p.text||'').split(/\n+/).filter(t=>t.trim());
   if(pieces.length<=1){steps.push({html:partHTML(p),title:'解析步驟'});continue}
   // Only split pure-text paragraphs; do not destroy inline drawing positions.
   if(p.inlineImages?.length||p.images?.length){steps.push({html:partHTML(p),title:'附公式／圖形的解析'});continue}
   for(const t of pieces)steps.push({html:'<p>'+mathFormattedText(t)+'</p>',title:'解析步驟'});
  }
 }else if(q.explanation?.trim()){
  const chunks=String(q.explanation).split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(chunks.length>1)chunks.forEach(t=>steps.push({html:'<p>'+mathFormattedText(t)+'</p>',title:'解析步驟'}));
  else steps.push({html:'<p>'+mathFormattedText(q.explanation)+'</p>',title:'解析說明'});
 }

}

function parseQuestion(q){

 for(const p of q.parts||[]){if(p.kind!=='p'){(p.kind==='table'&&p.placement==='stem'?stem:(optionMode&&current?current.parts:stem)).push(partHTML(p));continue}

function isKangxuanBank(blocks){

  }
 }
 for(const key of Object.keys(result.entries))if(/^fill-\d+$/.test(key)&&Array.isArray(result.entries[key].referenceAnswers)&&result.entries[key].referenceAnswers.length)delete result.entries[key];

/* APP 15.0: 康軒英語 DOCX 專用規則。輸入保持原 Word 段落及圖片，不依賴特定單元題目。 */

function kxNewQ(section,n,part,sub=null,group=null){

function kxEnglishGroupSplit(p){

function parseKangxuanEnglishBlocks(blocks,filename){

      data.warnings.push(`第 ${n} 組未找到獨立組號，已自動建立，請確認`);

       data.questions.push(kxNewQ(sec,Number(data.groups[activeGroup].number),part,sub,activeGroup));
      }

function kxEnglishAnswerSlots(s){

  }
  return s.split(/[；;]/).map(x=>x.trim()).filter(Boolean);
}
function kxEnglishDetailSlots(detail){

  return Object.fromEntries(markers.map((m,i)=>[Number(m[1]),detail.slice(m.index+m[0].length,i+1<markers.length?markers[i+1].index:detail.length).trim()]));
}
function parseKangxuanEnglishAnswerBlocks(blocks,filename,stats){

function matchSubMarker(s){let m=norm(s||'').match(/[（(]\s*([1-9][0-9]?)\s*[）)]/);return m?Number(m[1]):null}

   }
   if(sub!==null&&blank){

function scratchSetCanvasSize(){if(!scratchCanvas||!scratchCtx)return;scratchDpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(280,Math.round(scratchCanvas.getBoundingClientRect().width||500));const h=310;scratchCanvas.width=Math.round(w*scratchDpr);scratchCanvas.height=Math.round(h*scratchDpr);scratchCtx.setTransform(scratchDpr,0,0,scratchDpr,0,0);scratchCtx.fillStyle='#fff';scratchCtx.fillRect(0,0,w,h);scratchCtx.lineCap='round';scratchCtx.lineJoin='round'}

e 'scratchClear':scratchClear();break;case 'scratchSave':scratchSave();break;case 'scratchPen':scratchTool='pen';scratchUpdateControls();break;case 'scratchErase':scratchTool='erase';scratchUpdateControls();break;case 'shareWrongPdf':shareWrongPdf();break;case 'saveWrongPdf':saveWrongPdf();break;case 'downloadWrong':{let ids=preparePrint(),doc='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>錯題本</title><style>body{font:17px/1.65 sans-serif;max-width:850px;margin:25px auto;padding:15px}img{max-width:90%;max-height:360px}table{border-collapse:collapse}td{border:1px solid #555;padding:5px}.report-item{break-inside:avoid;border-bottom:1px solid #aaa}.report-footer{break-before:page;margin-top:30px}</style></head><body><h1>'+esc(bank.title)+'　錯題本</h1>'+wrongBookHTML(ids,true)+'</body></html>';if(ids.length)download(safeFilename(bank.title)+'_錯題本.html',doc);else toast('目前沒有需要輸出的題目');break}case 'gmail':{let email=$('teacherEmail')?.value.trim(),name=$('mailStudentName')?.value.trim();if(!email||!/^\S+@\S+\.\S+$/.test(email)){toast('請先輸入有效的收件 Gmail 信箱');return}state.name=name||state.name;let url='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(email)+'&su='+encodeURIComponent(bank.title+'｜電子測驗交卷｜'+state.name)+'&body='+encodeURIComponent(reportText());window.open(url,'_blank','noopener,noreferrer');break}case 'copyReport':{navigator.clipboard?.writeText(reportText()).then(()=>toast('成績摘要已複製'),()=>fallbackCopy(reportText()))||fallbackCopy(reportText());break}case 'saveEdit':saveEdit(el.dataset.id);break;
 case 'hwToggle':hwToggle(el.dataset.id);break;case 'hwPen':hwTool(el.dataset.id,'pen');break;case 'hwEraser':hwTool(el.dataset.id,'eraser');break;case 'hwUndo':hwUndo(el.dataset.id);break;case 'hwClear':hwClear(el.dataset.id);break;case 'hwDownload':hwDownload(el.dataset.id);break;case 'hwExportRecord':hwExportRecord();break;case 'studyNext':{let q=getQ(el.dataset.id);if(q){state.studyReveal??={};state.studyReveal[q.id]=Math.min(studySteps(q).length,(state.studyReveal[q.id]||0)+1);render()}break}
